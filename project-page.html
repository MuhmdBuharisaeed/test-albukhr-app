<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Project</title>
  
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/global-core.css">
<link rel="stylesheet" href="css/global-layout.css">
<link rel="stylesheet" href="css/global-components.css">
<link rel="stylesheet" href="css/global-style.css">

<!-- Custom App Alert -->
<link rel="stylesheet" href="css/app-alert.css">
  
</head>

<body>

<header class="header">
  <div class="header-left">
    <span id="projectTitle"></span>
  </div>
  <div class="header-right" onclick="openInfo()">ℹ️</div>
</header>

<div class="fixed-section">

  <div class="stats">

<div class="stat-card">
<span>Your Stake</span>
<strong id="aStake">0.00 Pi</strong>

<div id="stakeStatus"
style="font-size:12px;color:#666;margin-top:4px">
</div>

</div>

<div class="stat-card">
<span>Your Reward</span>
<strong id="aReward">0.00 Pi</strong>
</div>

  </div>

  <div class="short-info" id="projectDescription"></div>

  <div class="btns">
<button class="btn primary" onclick="openModal()">
Stake
</button>

<button class="btn secondary" onclick="openWithdrawModal()">
💸 Withdraw Rewards
</button>
</div>

<div class="capital-wrapper">
<button class="btn capital-btn" onclick="openCapitalModal()">
🏦 Withdraw Capital
</button>
</div>

<div class="scroll-area">

  <div class="scroll-area">
    <div class="tx-header">

    <h3 id="txTitle">
        Transaction History
    </h3>

    <button
        id="refreshBtn"
        class="refresh-btn"
        onclick="manualRefresh()">

        🔄 Refresh

    </button>

</div>

<div id="projectHistory"></div>
  </div>

</div>

<!-- STAKE MODAL -->
<div class="modal" id="stakeModal">
  <div class="modal-box">
    <h3 id="stakeTitle"></h3>

    <label>Amount (Pi)</label>
    <input type="number" id="amountInput">

    <small id="minHint"></small>

    <label>Duration</label>
    <select id="durationSelect"></select>

    <div class="btns">
      <button class="btn primary" onclick="confirmStake()">Confirm</button>
      <button class="btn secondary" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<!-- SUCCESS MODAL -->
<div class="modal" id="successModal">
  <div class="modal-box success">
    <h3>Stake Successful</h3>
    <p id="successText"></p>
    <button class="btn primary" onclick="closeSuccess()">OK</button>
  </div>
</div>

<!-- INFO MODAL -->
<div class="modal" id="infoModal">
  <div class="modal-box">
    <h3 id="infoTitle"></h3>
    <p id="infoText"></p>
    <button class="btn secondary" onclick="closeInfo()">Close</button>
  </div>
</div>

<!-- WITHDRAW MODAL -->
<div class="modal" id="withdrawModal">
  <div class="modal-box">
    <h3>Withdraw Rewards</h3>

    <label>Amount</label>

<input
    type="number"
    id="withdrawAmount"
    min="0.01"
    step="0.0000001">

    <small id="availableBalance"></small>

    <div style="font-size:12px;color:#666;margin-top:6px">
Fee (1%): 
<strong id="withdrawFee">0.00 Pi</strong>
</div>

<div style="font-size:12px;color:#666">
Total Deduction:
<strong id="withdrawTotalDeduction">0.00 Pi</strong>
</div>

<div style="font-size:12px;color:#666">
Wallet Receive: 
<strong id="withdrawReceive">0.00 Pi</strong>
</div>
    
    <label>Wallet Address</label>
    <input type="text" id="walletAddress">

    <div class="btns">
      <button class="btn primary" onclick="confirmWithdraw()">Confirm</button>
      <button class="btn secondary" onclick="closeWithdraw()">Cancel</button>
    </div>
  </div>
</div>

<!-- CAPITAL WITHDRAW MODAL -->
<div class="modal" id="capitalModal">
<div class="modal-box">

<h3>Withdraw Capital</h3>

<label>Amount</label>

<input
    type="number"
    id="capitalWithdrawAmount"
    min="0.01"
    step="0.0000001">

<small id="capitalAvailable"></small>

<div style="font-size:12px;color:#666;margin-top:6px">
Fee (1%): 
<strong id="capitalWithdrawFee">0.00 Pi</strong>
</div>

<div style="font-size:12px;color:#666">
Total Deduction:
<strong id="capitalTotalDeduction">0.00 Pi</strong>
</div>

<div style="font-size:12px;color:#666">
Wallet Receive: 
<strong id="capitalWithdrawReceive">0.00 Pi</strong>
</div>

<label>Wallet Address</label>
<input type="text" id="capitalWallet">

<div class="btns">
<button class="btn primary"
onclick="confirmCapitalWithdraw()">
Confirm
</button>

<button class="btn secondary"
onclick="closeCapitalModal()">
Cancel
</button>
</div>

</div>
</div>
  

<!-- 4. INIT -->
<script>
document.addEventListener("DOMContentLoaded", async () => {

  if(typeof initPi === "function"){
    initPi();
  }

  if(typeof ensurePiAuth === "function"){
    await ensurePiAuth();
  }

});
</script>

<!-- =========================================
     PI SDK
========================================= -->
<script src="https://sdk.minepi.com/pi-sdk.js"></script>

<!-- =========================================
     SUPABASE SDK
========================================= -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- =========================================
     ALBUKHR NETWORK FOUNDATION
========================================= -->
<script src="js/environment-switcher.js"></script>
<script src="js/supabase-core.js"></script>

<!-- =========================================
     PI AUTH
========================================= -->
<script src="js/pi-auth.js"></script>

<!-- =========================================
     PI PAYMENT
========================================= -->
<script src="js/pi-payment.js"></script>

<!-- =========================================
     PROJECT CONFIG
========================================= -->
<script src="js/project-config.js"></script>

<!-- =========================================
     ALBUKHR ENGINES
========================================= -->
<script src="js/unified-transactions.js"></script>
<script src="js/albukhr-transaction-engine.js"></script>
<script src="js/smart-liquidity-engine.js"></script>
<script src="js/staking.js"></script>
<script src="js/withdraw.js"></script>

<!-- =========================================
     UI ALERT
========================================= -->
<script src="js/app-alert.js"></script>

<!-- =========================================
     PROJECT CONTROLLER
========================================= -->
<script src="js/page/project-page.js"></script>

<!-- =========================================
     APP ALERT UI
========================================= -->
<div id="appAlert" class="app-alert">

  <div class="app-alert-box">

    <h3 id="appAlertTitle">
      Notice
    </h3>

    <p id="appAlertText"></p>

    <button onclick="closeAppAlert()">
      OK
    </button>

  </div>

</div>
  
</body>
  </html>
