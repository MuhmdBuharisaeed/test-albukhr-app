<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>ALBUKHR Admin Access</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/albukhr-ui.css">
<link rel="stylesheet" href="css/admin/admin-login.css">

</head>

<body>

<header class="header">

<img
src="images/ALBUKHR_Logo_Optimized_1024x1024.png"
class="main-logo"
alt="ALBUKHR Logo">

</header>


<div class="login-wrap">

<div class="login-card">

<div class="brand">
ALBUKHR • Admin Portal
</div>

<div class="subtitle">
Secure administrator sign in
</div>


<div class="form-group">

<label for="email">
Administrator Email
</label>

<input
id="email"
type="email"
autocomplete="username"
placeholder="Enter administrator email"
>

</div>


<div class="form-group">

<label for="key">
Access Key
</label>

<input
id="key"
type="password"
autocomplete="current-password"
placeholder="Enter secure access key"
>

</div>


<button
type="button"
class="login-btn"
onclick="login()">

Access Control Center

</button>


<div class="note">

Unauthorized access is strictly prohibited.
All login activities are monitored.

</div>

</div>

</div>

<!-- =========================================
     SUPABASE SDK
========================================= -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<!-- =========================================
     ISOLATED ADMIN SUPABASE AUTH CORE
========================================= -->
<script src="js/supabase-admin-auth/admin-supabase-auth.js"></script>


<!-- =========================================
     ADMIN LOGS
========================================= -->
<script src="js/supabase-admin-auth/admin-logs.js"></script>


<!-- =========================================
     ADMIN SESSION
========================================= -->
<script src="js/supabase-admin-auth/admin-session.js"></script>


<!-- =========================================
     ADMIN AUTH
========================================= -->
<script src="js/supabase-admin-auth/admin-auth.js"></script>


<!-- =========================================
     ADMIN PERMISSIONS
========================================= -->
<script src="js/supabase-admin-auth/admin-permissions.js"></script>


<!-- =========================================
     ADMIN LOGIN CONTROLLER
========================================= -->
<script src="js/supabase-admin-auth/admin-login.js"></script>

</body>

</html>
