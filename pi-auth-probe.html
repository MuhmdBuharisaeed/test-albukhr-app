<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>ALBUKHR • Pi Auth Probe</title>

  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #f5f8f6;
      color: #172019;
      font-family: Arial, sans-serif;
    }

    main {
      max-width: 700px;
      margin: 40px auto;
      background: #fff;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }

    h1 {
      margin-top: 0;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 14px 20px;
      background: #0f7a3d;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #status {
      margin-top: 18px;
      padding: 14px;
      border-radius: 12px;
      background: #eef4ef;
      white-space: pre-wrap;
    }

    #log {
      margin-top: 18px;
      padding: 16px;
      min-height: 220px;
      max-height: 500px;
      overflow: auto;
      border-radius: 12px;
      background: #111;
      color: #eaf8ef;
      font: 13px/1.5 monospace;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>

<body>

<main>

  <h1>ALBUKHR Pi Auth Probe</h1>

  <p>
    Minimal Pi SDK authentication test.
    No Supabase, no Testnet session, no ALBUKHR payment client.
  </p>

  <button id="runBtn" type="button">
    Test Pi Authentication
  </button>

  <div id="status">READY</div>

  <div id="log"></div>

</main>

<script src="https://sdk.minepi.com/pi-sdk.js"></script>

<script>
(function () {
  "use strict";

  var SDK_VERSION = "2.0";
  var SANDBOX = false;
  var AUTH_TIMEOUT_MS = 45000;

  var startTime = Date.now();

  var statusNode = document.getElementById("status");
  var logNode = document.getElementById("log");
  var button = document.getElementById("runBtn");

  function elapsed() {
    return (Date.now() - startTime) + "ms";
  }

  function clean(value) {
    return String(value == null ? "" : value).trim();
  }

  function safeJson(value) {
    try {
      return JSON.stringify(value);
    } catch (_) {
      return "[unserializable]";
    }
  }

  function log(event, detail) {
    var line = "[" + elapsed() + "] " + event;

    if (detail !== undefined) {
      line += "\n" + safeJson(detail);
    }

    logNode.textContent +=
      (logNode.textContent ? "\n" : "") + line;

    logNode.scrollTop = logNode.scrollHeight;

    console.log(
      "[ALBUKHR PI AUTH PROBE]",
      event,
      detail
    );
  }

  function status(message) {
    statusNode.textContent = clean(message);
  }

  function run() {
    button.disabled = true;

    startTime = Date.now();

    status("INITIALIZING_PI");

    log("PROBE_START", {
      host: window.location.host,
      origin: window.location.origin,
      sdkVersion: SDK_VERSION,
      sandbox: SANDBOX,
      piPresent: !!window.Pi
    });

    if (!window.Pi) {
      log("PI_SDK_MISSING");
      status("PI_SDK_MISSING");
      button.disabled = false;
      return;
    }

    if (
      typeof window.Pi.init !== "function" ||
      typeof window.Pi.authenticate !== "function"
    ) {
      log("PI_SDK_METHOD_MISSING", {
        init: typeof window.Pi.init,
        authenticate: typeof window.Pi.authenticate
      });

      status("PI_SDK_METHOD_MISSING");
      button.disabled = false;
      return;
    }

    try {
      window.Pi.init({
        version: SDK_VERSION,
        sandbox: SANDBOX
      });

      log("PI_INIT_OK", {
        version: SDK_VERSION,
        sandbox: SANDBOX
      });

      status("PI_INITIALIZED");
    } catch (error) {
      log("PI_INIT_ERROR", {
        name: error && error.name,
        message: error && error.message
      });

      status("PI_INIT_ERROR");

      button.disabled = false;
      return;
    }

    var scopes = ["username"];

    log("AUTH_CALLING", {
      scopes: scopes
    });

    status("PI_AUTHENTICATING");

    var authPromise;

    try {
      authPromise = window.Pi.authenticate(
        scopes,
        function onIncompletePaymentFound(payment) {
          log("INCOMPLETE_PAYMENT_FOUND", {
            paymentId:
              clean(
                payment &&
                (payment.identifier || payment.id)
              )
          });
        }
      );
    } catch (error) {
      log("AUTH_THROWN", {
        name: error && error.name,
        message: error && error.message
      });

      status("AUTH_THROWN");

      button.disabled = false;
      return;
    }

    if (
      !authPromise ||
      typeof authPromise.then !== "function"
    ) {
      log("AUTH_PROMISE_INVALID", {
        type: typeof authPromise
      });

      status("AUTH_PROMISE_INVALID");

      button.disabled = false;
      return;
    }

    var timeoutPromise = new Promise(
      function (_, reject) {
        setTimeout(function () {
          reject(
            new Error(
              "PI_AUTH_TIMEOUT_" +
              AUTH_TIMEOUT_MS +
              "MS"
            )
          );
        }, AUTH_TIMEOUT_MS);
      }
    );

    Promise.race([
      authPromise,
      timeoutPromise
    ])
    .then(function (result) {

      log("AUTH_SUCCESS", {
        userPresent: !!(
          result &&
          result.user
        ),

        uidPresent: !!clean(
          result &&
          result.user &&
          result.user.uid
        ),

        usernamePresent: !!clean(
          result &&
          result.user &&
          result.user.username
        ),

        accessTokenPresent: !!clean(
          result &&
          result.accessToken
        )
      });

      status("AUTH_SUCCESS");

      console.log(
        "[ALBUKHR PI AUTH PROBE RESULT]",
        result
      );

    })
    .catch(function (error) {

      log("AUTH_FAILED_OR_TIMEOUT", {
        name: error && error.name,
        message: error && error.message
      });

      status(
        "AUTH_FAILED_OR_TIMEOUT: " +
        (
          error && error.message
            ? error.message
            : "UNKNOWN_ERROR"
        )
      );

    })
    .finally(function () {
      button.disabled = false;
    });
  }

  button.addEventListener(
    "click",
    run
  );

  log("PROBE_READY", {
    host: window.location.host,
    origin: window.location.origin,
    piPresent: !!window.Pi,
    sdkVersion: SDK_VERSION,
    sandbox: SANDBOX
  });

})();
</script>

</body>
</html>
