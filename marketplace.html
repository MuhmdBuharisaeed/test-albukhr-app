<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>ALBUKHR Testnet Marketplace</title>

  <meta
    name="description"
    content="ALBUKHR Testnet Marketplace for approved project registry and interface validation."
  >
  <meta name="theme-color" content="#0f7a3d">
  <meta name="color-scheme" content="light">

<link rel="stylesheet" href="css/testnet.css">
<link rel="stylesheet" href="css/testnet-project-owner-bridge.css?v=20260923-owner7">
<link rel="stylesheet" href="css/testnet-admin-bridge.css?v=20260923-admin1">
  
</head>

<body data-page="marketplace">

  <header class="header">
    <a href="index.html" aria-label="ALBUKHR Testnet Home">
      ALBUKHR
    </a>

    <div
      style="display:flex;align-items:center;gap:8px"
      aria-label="Testnet marketplace navigation"
    >
      <a
        class="env"
        href="https://app.albukhr.com/login.html"
        aria-label="Return to ALBUKHR Mainnet"
        title="Return to Mainnet"
      >
        TESTNET
      </a>

      <span class="env" aria-current="page">
        MARKETPLACE
      </span>
    </div>
  </header>

  <main>
    <div class="section-head">
      <h1>Testnet Marketplace</h1>

      <span
        id="registryStatus"
        role="status"
        aria-live="polite"
        aria-atomic="true"
      >
        Authenticating…
      </span>
    </div>

    <div
      id="projectList"
      class="project-grid"
      aria-live="polite"
      aria-busy="true"
    ></div>

    <div class="notice">
      <strong>Transactions are not enabled yet.</strong>

      <p>
        This stage is for registry and UI validation only.
        Mainnet funds remain isolated.
      </p>
    </div>
  </main>

  <!-- ALBUKHR Dock Navigation — unchanged -->
  <nav class="dock-nav" aria-label="Primary navigation">

    <a
      href="index.html"
      class="dock-item"
    >
      <svg
        viewBox="0 0 24 24"
        class="dock-icon"
        aria-hidden="true"
        focusable="false"
      >
        <path d="M3 10L12 3l9 7v10a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/>
      </svg>

      <span>Home</span>
    </a>

    <a
      href="index.html#investor"
      class="dock-item"
    >
      <svg
        viewBox="0 0 24 24"
        class="dock-icon"
        aria-hidden="true"
        focusable="false"
      >
        <path d="M16 11c1.66 0 3-1.34 3-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3z"/>
        <path d="M8 11c1.66 0 3-1.34 3-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3z"/>
        <path d="M2 20v-1c0-2.21 3.58-4 6-4s6 1.79 6 4v1z"/>
        <path d="M14 20v-1c0-1.5 1.5-2.8 3.5-3.5 2 .7 3.5 2 3.5 3.5v1z"/>
      </svg>

      <span>Investor</span>
    </a>

    <a
      href="marketplace.html"
      class="dock-item active"
      aria-current="page"
    >
      <svg
        viewBox="0 0 24 24"
        class="dock-icon"
        aria-hidden="true"
        focusable="false"
      >
        <path d="M4 9h16l-1.3-5H5.3L4 9z"/>
        <path d="M5 9v10h14V9"/>
        <path d="M3 9h18"/>
        <path d="M8 19v2h8v-2"/>
      </svg>

      <span>Marketplace</span>
    </a>

  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="js/core/environment-core.js?v=20260920-assetfix1"></script>
  <script src="js/core/supabase-core.js?v=20260920-assetfix1"></script>

  <script src="js/testnet-gateway-auth.js?v=20260920-assetfix1"></script>

  <script src="js/project-registry.js?v=20260920-assetfix1"></script>
  <script src="js/project-navigation.js?v=20260920-assetfix1"></script>

  <script src="js/testnet-app.js?v=20260920-assetfix1"></script>

<script src="js/testnet-admin-auth.js?v=20260923-admin1"></script>
<script src="js/testnet-admin-bridge.js?v=20260923-admin1"></script>

</body>
</html>
